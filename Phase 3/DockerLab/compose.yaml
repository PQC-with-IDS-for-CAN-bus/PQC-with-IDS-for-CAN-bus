# ==============================================================================
# Pure C++17 DockerLab Benchmarking Suite — Docker Compose Orchestration
# ==============================================================================
#
# Multi-domain virtual vehicle network architecture for 3-Tier CISG:
#   - Domain 1: Powertrain & Safety-Critical Bus (ECU 1)
#   - Domain 2: Chassis & Active Braking Bus (ECU 2)
#   - Domain 3: Body & Comfort Bus (ECU 3)
#   - Domain 4: Infotainment & Telematics Bus (ECU 4)
#   - Relay Node: Inter-domain routing & physical wire serialization emulation
#   - CISG Gateway: Central In-Vehicle Security Gateway with PQC & ONNX INT8 IDS
#   - Controller: 31-scenario autonomous test harness & Data Contract exporter
#
# Standard References:
#   - ISO 11898-1:2015: CAN-FD Data Link Layer & Framing [^1]
#   - ISO 26262 ASIL-D: Functional Safety Memory Locking & Real-Time Bounds [^2]
#   - NIST FIPS 204: ML-DSA-44 Post-Quantum Digital Signature Standard [^3]
#   - NIST SP 800-232: Ascon-AEAD128 Lightweight Cryptography [^4]
#
# Footnotes:
#   [^1]: ISO 11898-1:2015, Road Vehicles — CAN Data Link Layer.
#   [^2]: ISO 26262-5:2018, Hardware & Software Level Safety Integrity.
#   [^3]: NIST FIPS 204 (Aug 2024), DOI: 10.6028/NIST.FIPS.204.
#   [^4]: NIST SP 800-232 (Oct 2023), DOI: 10.6028/NIST.SP.800-232.
# ==============================================================================

name: pqc-dockerlab-cpp17

x-app: &app
  image: pqc-can-lab:cpp17
  user: '${LAB_UID:-1000}:${LAB_GID:-1000}'
  build:
    context: ../..
    dockerfile: Phase 3/DockerLab/Dockerfile
  init: true
  read_only: false
  tmpfs: [/tmp]
  cap_drop: [ALL]
  cap_add:
    - NET_RAW      # SocketCAN raw frame access
    - NET_ADMIN    # Interface configuration & routing
    - IPC_LOCK     # ASIL-D mlockall memory page locking
  security_opt:
    - no-new-privileges:true
  networks:
    - management
  pids_limit: 512
  ulimits:
    memlock:
      soft: -1
      hard: -1
    nproc: 65535
  healthcheck:
    test: ["CMD-SHELL", "curl -f -s http://localhost:8080/health || exit 1"]
    interval: 3s
    timeout: 3s
    retries: 45
    start_period: 5s

services:
  # ----------------------------------------------------------------------------
  # 1. Fault Injection & Wire Serialization Relay Node
  # ----------------------------------------------------------------------------
  relay:
    <<: *app
    container_name: dockerlab-relay
    command: ["/usr/local/bin/relay_node"]
    environment:
      ROLE: relay
      GATEWAY_ENGINE: cpp
      PORT: '8080'
    volumes:
      - ./state/logs:/logs
    ports:
      - "8085:8080"

  # ----------------------------------------------------------------------------
  # 2. Central In-Vehicle Security Gateway (CISG)
  # ----------------------------------------------------------------------------
  gateway:
    <<: *app
    container_name: dockerlab-gateway
    command: ["/usr/local/bin/cisg_gateway"]
    environment:
      ROLE: gateway
      GATEWAY_ENGINE: cpp
      PORT: '8080'
    volumes:
      - ./state/credentials/gateway.json:/credentials/identity.json:ro
      - ./state/logs:/logs
      - ../../Phase 2/IDS/ONNX:/models:ro
      - ../config:/config:ro
    ports:
      - "8080:8080"
    depends_on:
      relay:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 3. Automotive ECU 1 (Domain 1: Powertrain)
  # ----------------------------------------------------------------------------
  ecu1:
    <<: *app
    container_name: dockerlab-ecu1
    command: ["/usr/local/bin/ecu_node", "--domain", "1", "--port", "8080"]
    environment:
      ROLE: ecu
      DOMAIN: '1'
      GATEWAY_ENGINE: cpp
      PORT: '8080'
    volumes:
      - ./state/credentials/ecu1.json:/credentials/identity.json:ro
      - ./state/input:/input:ro
      - ./state/logs/ecu1:/logs/ecu1
    ports:
      - "8081:8080"
    depends_on:
      gateway:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 4. Automotive ECU 2 (Domain 2: Chassis)
  # ----------------------------------------------------------------------------
  ecu2:
    <<: *app
    container_name: dockerlab-ecu2
    command: ["/usr/local/bin/ecu_node", "--domain", "2", "--port", "8080"]
    environment:
      ROLE: ecu
      DOMAIN: '2'
      GATEWAY_ENGINE: cpp
      PORT: '8080'
    volumes:
      - ./state/credentials/ecu2.json:/credentials/identity.json:ro
      - ./state/logs/ecu2:/logs/ecu2
    ports:
      - "8082:8080"
    depends_on:
      gateway:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 5. Automotive ECU 3 (Domain 3: Body & Comfort)
  # ----------------------------------------------------------------------------
  ecu3:
    <<: *app
    container_name: dockerlab-ecu3
    command: ["/usr/local/bin/ecu_node", "--domain", "3", "--port", "8080"]
    environment:
      ROLE: ecu
      DOMAIN: '3'
      GATEWAY_ENGINE: cpp
      PORT: '8080'
    volumes:
      - ./state/credentials/ecu3.json:/credentials/identity.json:ro
      - ./state/logs/ecu3:/logs/ecu3
    ports:
      - "8083:8080"
    depends_on:
      gateway:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 6. Automotive ECU 4 (Domain 4: Infotainment & Telematics)
  # ----------------------------------------------------------------------------
  ecu4:
    <<: *app
    container_name: dockerlab-ecu4
    command: ["/usr/local/bin/ecu_node", "--domain", "4", "--port", "8080"]
    environment:
      ROLE: ecu
      DOMAIN: '4'
      GATEWAY_ENGINE: cpp
      PORT: '8080'
    volumes:
      - ./state/credentials/ecu4.json:/credentials/identity.json:ro
      - ./state/logs/ecu4:/logs/ecu4
    ports:
      - "8084:8080"
    depends_on:
      gateway:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 7. Red Team Adversarial Injector Node
  # ----------------------------------------------------------------------------
  attacker:
    image: pqc-can-lab:cpp17
    container_name: dockerlab-attacker
    user: '${LAB_UID:-1000}:${LAB_GID:-1000}'
    command: ["python3", "attacker.py"]
    init: true
    read_only: false
    tmpfs: [/tmp]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    volumes:
      - ./state/mailbox:/mailbox
      - ./state/logs/attacker:/logs/attacker

  # ----------------------------------------------------------------------------
  # 8. Testbed Orchestrator & Autonomous Controller
  # ----------------------------------------------------------------------------
  controller:
    <<: *app
    container_name: dockerlab-controller
    profiles: [tools]
    working_dir: /workspace/Phase 3/DockerLab
    command: ["python3", "controller.py"]
    cap_add: []
    healthcheck:
      disable: true
    volumes:
      - ./state/logs:/logs:ro
      - ./state/mailbox:/mailbox
      - ./state/exports:/exports
      - ./state/captures:/captures:ro
      - ./state/runtime.json:/runtime.json:ro
      - ../Code:/contracts/code:ro
      - ../config:/contracts/config:ro
    depends_on:
      gateway:
        condition: service_healthy
      ecu1:
        condition: service_healthy
      ecu2:
        condition: service_healthy
      ecu3:
        condition: service_healthy
      ecu4:
        condition: service_healthy
      relay:
        condition: service_healthy

# ------------------------------------------------------------------------------
# Management Network
# ------------------------------------------------------------------------------
networks:
  management:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
